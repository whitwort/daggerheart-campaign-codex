<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aether's Children</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: sans-serif; padding: 1.5rem 2rem; }
    header { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 1.4rem; }
    #auth-area { margin-left: auto; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
    #role-badge { padding: 0.15rem 0.5rem; border-radius: 3px; background: #eee; }
    #signin-buttons button { padding: 0.3rem 0.6rem; font-size: 0.85rem; cursor: pointer; }
    nav#tabs { margin-top: 1rem; border-bottom: 1px solid #ccc; }
    nav#tabs button { background: none; border: none; padding: 0.5rem 1rem; cursor: pointer; font-size: 1rem; }
    nav#tabs button.active { border-bottom: 3px solid #444; font-weight: bold; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    #map-tab-placeholder { color: #888; margin-top: 1rem; }
    #map-container { height: 70vh; margin-top: 1rem; background: #ddd; display: none; }

    #codex-tab { display: flex; gap: 1.5rem; margin-top: 1rem; }
    #codex-list-pane { flex: 0 0 320px; }
    #codex-detail-pane { flex: 1; min-width: 0; }
    #codex-filters { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    #codex-filters select, #codex-filters input { padding: 0.35rem; font-size: 0.9rem; }
    #codex-search { flex: 1; }
    #codex-entries { list-style: none; padding: 0; margin: 0; max-height: 70vh; overflow-y: auto; border: 1px solid #ccc; }
    #codex-entries li { padding: 0.5rem 0.75rem; border-bottom: 1px solid #eee; cursor: pointer; }
    #codex-entries li:hover { background: #f5f5f5; }
    #codex-entries li.active { background: #e0e8ff; }
    #codex-entries .entry-category { font-size: 0.75rem; color: #666; }
    #codex-detail { border: 1px solid #ccc; padding: 1rem; min-height: 200px; }
    #codex-detail h2 { margin-top: 0; }
    #codex-view-badge { display: inline-block; padding: 0.15rem 0.5rem; font-size: 0.75rem; border-radius: 3px; margin-left: 0.5rem; vertical-align: middle; }
    #codex-view-badge.gm { background: #ffe0b0; }
    #codex-view-badge.player { background: #c8e6c9; }
    #codex-tags span { display: inline-block; background: #eee; border-radius: 3px; padding: 0.1rem 0.4rem; font-size: 0.75rem; margin-right: 0.25rem; }
    #codex-empty { color: #888; }

    #codex-new-btn { display: none; margin-bottom: 0.75rem; padding: 0.4rem 0.8rem; cursor: pointer; }
    #codex-detail-actions { display: none; gap: 0.5rem; margin-top: 1rem; }
    #codex-detail-actions button { padding: 0.3rem 0.7rem; cursor: pointer; }

    #entry-form-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      align-items: center; justify-content: center; z-index: 100;
    }
    #entry-form-overlay.open { display: flex; }
    #entry-form {
      background: #fff; border-radius: 4px; padding: 1.25rem 1.5rem;
      width: 90%; max-width: 520px; max-height: 85vh; overflow-y: auto;
    }
    #entry-form h3 { margin-top: 0; }
    #entry-form label { display: block; margin-top: 0.75rem; font-size: 0.85rem; font-weight: bold; }
    #entry-form input[type="text"], #entry-form textarea, #entry-form select {
      width: 100%; box-sizing: border-box; padding: 0.4rem; font-size: 0.9rem; margin-top: 0.2rem;
    }
    #entry-form textarea { min-height: 80px; resize: vertical; }
    #entry-form-actions { margin-top: 1.25rem; display: flex; gap: 0.5rem; justify-content: flex-end; }
    #entry-form-actions button { padding: 0.4rem 0.9rem; cursor: pointer; }
    #entry-form-error { color: #b00020; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
    #build-version { margin-top: 2rem; font-size: 0.7rem; color: #bbb; }
  </style>
</head>
<body>
  <header>
    <h1 id="campaign-title"></h1>
    <div id="auth-area">
      <span id="role-badge">Viewer</span>
      <span id="user-email"></span>
      <div id="signin-buttons">
        <button id="signin-google">Sign in with Google</button>
      </div>
      <button id="sign-out-btn" style="display:none;">Sign out</button>
    </div>
  </header>

  <nav id="tabs">
    <button id="tab-btn-codex" class="active" data-tab="codex-panel">Codex</button>
    <button id="tab-btn-map" data-tab="map-panel">Map</button>
  </nav>

  <div id="codex-panel" class="tab-panel active">
    <div id="codex-tab">
      <div id="codex-list-pane">
        <button id="codex-new-btn">+ New entry</button>
        <div id="codex-filters">
          <select id="codex-category-filter">
            <option value="">All categories</option>
          </select>
          <input id="codex-search" type="text" placeholder="Search name/tags...">
        </div>
        <ul id="codex-entries"></ul>
      </div>
      <div id="codex-detail-pane">
        <div id="codex-detail"><p id="codex-empty">Select an entry.</p></div>
      </div>
    </div>
  </div>
  <div id="map-panel" class="tab-panel">
    <p id="map-tab-placeholder">Map tab — coming in Phase 3.</p>
    <div id="map-container"></div>
  </div>

  <div id="entry-form-overlay">
    <div id="entry-form">
      <h3 id="entry-form-title">New Entry</h3>
      <label for="entry-form-name">Name</label>
      <input type="text" id="entry-form-name">

      <label for="entry-form-category">Category</label>
      <select id="entry-form-category"></select>

      <label for="entry-form-tags">Tags (comma-separated)</label>
      <input type="text" id="entry-form-tags">

      <label for="entry-form-content-gm">GM content</label>
      <textarea id="entry-form-content-gm"></textarea>

      <label for="entry-form-content-player">Player content</label>
      <textarea id="entry-form-content-player"></textarea>

      <p id="entry-form-error"></p>

      <div id="entry-form-actions">
        <button id="entry-form-cancel" type="button">Cancel</button>
        <button id="entry-form-save" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider,
      signInWithPopup, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore, collection, onSnapshot, doc, getDoc, addDoc, updateDoc, deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const CONFIG = window.APP_CONFIG;
    document.getElementById('campaign-title').textContent = CONFIG.campaignName;
    document.getElementById('tab-btn-codex').textContent = CONFIG.tabs.codex;
    document.getElementById('tab-btn-map').textContent = CONFIG.tabs.map;

    const firebaseApp = initializeApp(CONFIG.firebase);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);

    // --- Auth: signInWithPopup works here because this app is served from
    // Firebase Hosting on daggerheart-campaign-codex.web.app/.firebaseapp.com
    // — the same origin as authDomain. Under the old Apps Script hosting
    // (script.googleusercontent.com), this same call hit an unfixable origin
    // restriction — see auth-pivot-context.md for that postmortem, and the
    // separate Option A attempt (native Apps Script auth) that followed and
    // was abandoned when it turned out unable to force a sign-in prompt for
    // logged-out visitors. Google-only per Gregg's call — GitHub/Apple would
    // just be adding more providers below if that changes later.
    const roleBadge = document.getElementById('role-badge');
    const userEmailEl = document.getElementById('user-email');
    const signInButtonsEl = document.getElementById('signin-buttons');
    const signOutBtn = document.getElementById('sign-out-btn');

    function signInWith(providerFactory) {
      return function () {
        signInWithPopup(auth, providerFactory()).catch(function (err) {
          alert('Sign-in failed: ' + err.message);
        });
      };
    }

    document.getElementById('signin-google').addEventListener('click', signInWith(function () {
      return new GoogleAuthProvider();
    }));

    signOutBtn.addEventListener('click', function () {
      signOut(auth);
    });

    // --- Role resolution ---------------------------------------------------
    // GM: signed-in email matches CONFIG.gmEmail.
    // Player: signed-in email exists in players/{email} whitelist collection.
    // Viewer: everyone else, including unauthenticated.
    let currentRole = 'viewer';

    function resolveRole(user) {
      if (!user || !user.email) return Promise.resolve('viewer');
      if (user.email === CONFIG.gmEmail) return Promise.resolve('gm');
      return getDoc(doc(db, 'players', user.email)).then(function (snap) {
        return snap.exists() ? 'player' : 'viewer';
      });
    }

    onAuthStateChanged(auth, function (user) {
      if (user) {
        signInButtonsEl.style.display = 'none';
        signOutBtn.style.display = 'inline';
        userEmailEl.textContent = user.email || '(no email shared)';
      } else {
        signInButtonsEl.style.display = 'flex';
        signOutBtn.style.display = 'none';
        userEmailEl.textContent = '';
      }
      resolveRole(user).then(function (role) {
        currentRole = role;
        roleBadge.textContent = role;
        newEntryBtn.style.display = (role === 'gm') ? 'inline-block' : 'none';
        renderDetailForSelected();
      });
    });

    // --- Codex tab: live entries read --------------------------------------
    const categoryFilterEl = document.getElementById('codex-category-filter');
    const searchEl = document.getElementById('codex-search');
    const listEl = document.getElementById('codex-entries');
    const detailEl = document.getElementById('codex-detail');

    const formCategoryEl = document.getElementById('entry-form-category');

    CONFIG.categories.forEach(function (cat) {
      const filterOpt = document.createElement('option');
      filterOpt.value = cat;
      filterOpt.textContent = cat;
      categoryFilterEl.appendChild(filterOpt);

      const formOpt = document.createElement('option');
      formOpt.value = cat;
      formOpt.textContent = cat;
      formCategoryEl.appendChild(formOpt);
    });

    let allEntries = [];
    let selectedId = null;
    let gmPreviewAsPlayer = false;

    onSnapshot(collection(db, 'entries'), function (snapshot) {
      allEntries = [];
      snapshot.forEach(function (docSnap) {
        const data = docSnap.data();
        if (data.type === 'codex') {
          allEntries.push(Object.assign({ id: docSnap.id }, data));
        }
      });
      renderList();
    }, function (err) {
      listEl.innerHTML = '<li>Error loading entries: ' + err.message + '</li>';
    });

    function matchesFilters(entry) {
      const cat = categoryFilterEl.value;
      if (cat && entry.category !== cat) return false;

      const q = searchEl.value.trim().toLowerCase();
      if (!q) return true;
      const nameMatch = (entry.name || '').toLowerCase().indexOf(q) !== -1;
      const tagMatch = (entry.tags || []).some(function (t) {
        return t.toLowerCase().indexOf(q) !== -1;
      });
      return nameMatch || tagMatch;
    }

    function renderList() {
      const filtered = allEntries
        .filter(matchesFilters)
        .sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });

      listEl.innerHTML = '';
      if (filtered.length === 0) {
        const li = document.createElement('li');
        li.textContent = 'No entries match.';
        listEl.appendChild(li);
        return;
      }

      filtered.forEach(function (entry) {
        const li = document.createElement('li');
        li.dataset.id = entry.id;
        if (entry.id === selectedId) li.classList.add('active');

        const nameDiv = document.createElement('div');
        nameDiv.textContent = entry.name;
        const catDiv = document.createElement('div');
        catDiv.className = 'entry-category';
        catDiv.textContent = entry.category || '';

        li.appendChild(nameDiv);
        li.appendChild(catDiv);
        li.addEventListener('click', function () {
          selectedId = entry.id;
          renderList();
          renderDetailForSelected();
        });
        listEl.appendChild(li);
      });
    }

    function renderDetailForSelected() {
      const entry = allEntries.find(function (e) { return e.id === selectedId; });
      if (!entry) {
        detailEl.innerHTML = '<p id="codex-empty">Select an entry.</p>';
        return;
      }

      const effectiveRole = (currentRole === 'gm' && gmPreviewAsPlayer) ? 'player' : currentRole;
      const showGmContent = effectiveRole === 'gm';
      const bodyText = showGmContent ? entry.content_gm : entry.content_player;

      detailEl.innerHTML = '';

      const heading = document.createElement('h2');
      heading.textContent = entry.name;

      const badge = document.createElement('span');
      badge.id = 'codex-view-badge';
      badge.className = showGmContent ? 'gm' : 'player';
      badge.textContent = showGmContent ? 'GM view' : 'Player view';
      heading.appendChild(badge);
      detailEl.appendChild(heading);

      if (currentRole === 'gm') {
        const toggleBtn = document.createElement('button');
        toggleBtn.textContent = gmPreviewAsPlayer ? 'Show GM content' : 'Preview player view';
        toggleBtn.addEventListener('click', function () {
          gmPreviewAsPlayer = !gmPreviewAsPlayer;
          renderDetailForSelected();
        });
        detailEl.appendChild(toggleBtn);
      }

      const catP = document.createElement('p');
      catP.innerHTML = '<em>' + (entry.category || '') + '</em>';
      detailEl.appendChild(catP);

      const bodyP = document.createElement('p');
      bodyP.textContent = bodyText || '(no content for this view)';
      detailEl.appendChild(bodyP);

      if (entry.tags && entry.tags.length) {
        const tagsDiv = document.createElement('div');
        tagsDiv.id = 'codex-tags';
        entry.tags.forEach(function (t) {
          const span = document.createElement('span');
          span.textContent = t;
          tagsDiv.appendChild(span);
        });
        detailEl.appendChild(tagsDiv);
      }

      if (currentRole === 'gm') {
        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edit entry';
        editBtn.style.marginTop = '1rem';
        editBtn.addEventListener('click', function () {
          openEntryForm(entry);
        });
        detailEl.appendChild(editBtn);

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete entry';
        deleteBtn.style.marginTop = '1rem';
        deleteBtn.style.marginLeft = '0.5rem';
        deleteBtn.addEventListener('click', function () {
          deleteEntry(entry);
        });
        detailEl.appendChild(deleteBtn);
      }
    }

    categoryFilterEl.addEventListener('change', renderList);
    searchEl.addEventListener('input', renderList);

    // --- Entry authoring (GM only): create ---------------------------------
    const newEntryBtn = document.getElementById('codex-new-btn');
    const formOverlayEl = document.getElementById('entry-form-overlay');
    const formTitleEl = document.getElementById('entry-form-title');
    const formNameEl = document.getElementById('entry-form-name');
    const formTagsEl = document.getElementById('entry-form-tags');
    const formContentGmEl = document.getElementById('entry-form-content-gm');
    const formContentPlayerEl = document.getElementById('entry-form-content-player');
    const formErrorEl = document.getElementById('entry-form-error');
    const formSaveBtn = document.getElementById('entry-form-save');
    const formCancelBtn = document.getElementById('entry-form-cancel');

    let editingEntryId = null;

    function openEntryForm(entry) {
      editingEntryId = entry ? entry.id : null;
      formTitleEl.textContent = entry ? 'Edit Entry' : 'New Entry';
      formNameEl.value = entry ? entry.name || '' : '';
      formCategoryEl.value = entry ? (entry.category || CONFIG.categories[0]) : CONFIG.categories[0];
      formTagsEl.value = entry && entry.tags ? entry.tags.join(', ') : '';
      formContentGmEl.value = entry ? entry.content_gm || '' : '';
      formContentPlayerEl.value = entry ? entry.content_player || '' : '';
      formErrorEl.style.display = 'none';
      formErrorEl.textContent = '';
      formOverlayEl.classList.add('open');
      formNameEl.focus();
    }

    function closeEntryForm() {
      formOverlayEl.classList.remove('open');
    }

    function showFormError(message) {
      formErrorEl.textContent = message;
      formErrorEl.style.display = 'block';
    }

    function saveEntry() {
      const name = formNameEl.value.trim();
      if (!name) {
        showFormError('Name is required.');
        return;
      }

      const tags = formTagsEl.value
        .split(',')
        .map(function (t) { return t.trim(); })
        .filter(function (t) { return t.length > 0; });

      const entryData = {
        type: 'codex',
        name: name,
        category: formCategoryEl.value,
        tags: tags,
        content_gm: formContentGmEl.value,
        content_player: formContentPlayerEl.value
      };

      formSaveBtn.disabled = true;
      const savePromise = editingEntryId
        ? updateDoc(doc(db, 'entries', editingEntryId), entryData)
        : addDoc(collection(db, 'entries'), entryData);

      savePromise.then(function () {
        formSaveBtn.disabled = false;
        closeEntryForm();
      }).catch(function (err) {
        formSaveBtn.disabled = false;
        showFormError('Save failed: ' + err.message);
      });
    }

    function deleteEntry(entry) {
      const confirmed = window.confirm('Delete "' + entry.name + '"? This cannot be undone.');
      if (!confirmed) return;

      deleteDoc(doc(db, 'entries', entry.id)).then(function () {
        if (selectedId === entry.id) {
          selectedId = null;
          renderDetailForSelected();
        }
      }).catch(function (err) {
        window.alert('Delete failed: ' + err.message);
      });
    }

    newEntryBtn.addEventListener('click', function () { openEntryForm(); });
    formCancelBtn.addEventListener('click', closeEntryForm);
    formSaveBtn.addEventListener('click', saveEntry);
    formOverlayEl.addEventListener('click', function (e) {
      if (e.target === formOverlayEl) closeEntryForm();
    });
  </script>

  <script>
    document.querySelectorAll('nav#tabs button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('nav#tabs button').forEach(function (b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');

        if (btn.dataset.tab === 'map-panel') {
          initMapIfNeeded();
        }
      });
    });

    let mapInitialized = false;

    function initMapIfNeeded() {
      if (mapInitialized) return;
      mapInitialized = true;

      const placeholderEl = document.getElementById('map-tab-placeholder');
      const containerEl = document.getElementById('map-container');
      const mapConfig = window.APP_CONFIG;

      try {
        if (typeof L === 'undefined') {
          placeholderEl.textContent = 'Map library (Leaflet) failed to load.';
          return;
        }

        if (!mapConfig.mapImage) {
          placeholderEl.textContent = 'No map image configured yet.';
          return;
        }

        const img = new Image();
        img.onload = function () {
          try {
            placeholderEl.style.display = 'none';
            containerEl.style.display = 'block';

            // Match the container's aspect ratio to the image so fitBounds
            // doesn't leave large empty margins on one axis. Cap height so
            // very tall/wide maps don't blow out the viewport.
            const aspect = img.naturalHeight / img.naturalWidth;
            const availableWidth = containerEl.clientWidth;
            const targetHeight = Math.min(
              Math.max(availableWidth * aspect, 300),
              window.innerHeight * 0.8
            );
            containerEl.style.height = targetHeight + 'px';

            const bounds = [[0, 0], [img.naturalHeight, img.naturalWidth]];
            const map = L.map('map-container', {
              crs: L.CRS.Simple,
              minZoom: -3,
              zoomSnap: 0.25,
              zoomDelta: 0.5,
              maxBoundsViscosity: 1.0
            });
            L.imageOverlay(mapConfig.mapImage, bounds).addTo(map);

            setTimeout(function () {
              map.invalidateSize();
              map.fitBounds(bounds);

              // fitBounds can under-fit slightly (zoom snaps to the
              // nearest zoomSnap increment), leaving a grey margin on one
              // axis. Trim the container to the image's actual on-screen
              // size at the fitted zoom so the edges match exactly, then
              // lock panning/zoom-out to the image itself so grey never
              // becomes visible by dragging past an edge either.
              const llBounds = L.latLngBounds(bounds);
              const nw = map.latLngToContainerPoint(llBounds.getNorthWest());
              const se = map.latLngToContainerPoint(llBounds.getSouthEast());
              const fittedWidth = Math.round(Math.abs(se.x - nw.x));
              const fittedHeight = Math.round(Math.abs(se.y - nw.y));
              containerEl.style.width = fittedWidth + 'px';
              containerEl.style.height = fittedHeight + 'px';
              containerEl.style.margin = '1rem auto 0';

              map.invalidateSize();
              map.fitBounds(bounds);
              map.setMinZoom(map.getZoom());
              map.setMaxBounds(bounds);
            }, 0);
          } catch (err) {
            placeholderEl.style.display = 'block';
            containerEl.style.display = 'none';
            placeholderEl.textContent = 'Map render error: ' + err.message;
          }
        };
        img.onerror = function () {
          placeholderEl.textContent = 'Map image failed to load (' + mapConfig.mapImage + ').';
        };
        img.src = mapConfig.mapImage;
      } catch (err) {
        placeholderEl.textContent = 'Map init error: ' + err.message;
      }
    }
  </script>  <footer id="build-version">build __COMMIT_HASH__</footer>
</body>
</html>
