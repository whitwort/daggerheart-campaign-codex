<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aether's Children</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: sans-serif; padding: 1.5rem 2rem; }
    header { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 1.4rem; }
    #auth-area { margin-left: auto; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
    #role-badge { padding: 0.15rem 0.5rem; border-radius: 3px; background: #eee; }
    #signin-buttons button { padding: 0.3rem 0.6rem; font-size: 0.85rem; cursor: pointer; }
    nav#tabs { margin-top: 1rem; border-bottom: 1px solid #ccc; }
    nav#tabs button { background: none; border: none; padding: 0.5rem 1rem; cursor: pointer; font-size: 1rem; }
    nav#tabs button.active { border-bottom: 3px solid #444; font-weight: bold; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    #map-tab-placeholder { color: #888; margin-top: 1rem; }
    #map-container { height: 70vh; margin-top: 1rem; background: #ddd; display: none; }
    #map-gm-controls { display: none; gap: 0.5rem; align-items: center; margin-top: 1rem; }
    #map-gm-controls button { padding: 0.3rem 0.7rem; cursor: pointer; }
    #map-gm-controls button.active-mode { outline: 2px solid #4a6fdc; }
    #map-mode-hint { font-size: 0.85rem; color: #666; }
    #map-back-btn { display: block; margin-top: 0.75rem; padding: 0.35rem 0.8rem; cursor: pointer; }

    #pin-form-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      align-items: center; justify-content: center; z-index: 1000;
    }
    #pin-form-overlay.open { display: flex; }
    #pin-form {
      background: #fff; border-radius: 4px; padding: 1.25rem 1.5rem;
      width: 90%; max-width: 400px;
    }
    #pin-form h3 { margin-top: 0; }
    #pin-form label { display: block; margin-top: 0.5rem; font-size: 0.85rem; font-weight: bold; }
    #pin-form select, #pin-form input[type="text"], #pin-form input[type="number"] {
      width: 100%; box-sizing: border-box; padding: 0.4rem; font-size: 0.9rem; margin-top: 0.2rem;
    }
    #pin-form-type-toggle, #pin-form-childmap-mode-toggle {
      display: flex; gap: 1rem; margin-top: 0.5rem; font-size: 0.85rem; font-weight: normal;
    }
    #pin-form-type-toggle label, #pin-form-childmap-mode-toggle label {
      display: flex; align-items: center; gap: 0.3rem; font-weight: normal; margin-top: 0;
    }
    #pin-form-childmap-image-hint { font-size: 0.75rem; color: #666; margin: 0.3rem 0 0 0; }
    #pin-form-actions { margin-top: 1.25rem; display: flex; gap: 0.5rem; justify-content: flex-end; }
    #pin-form-actions button { padding: 0.4rem 0.9rem; cursor: pointer; }
    #pin-form-error { color: #b00020; font-size: 0.85rem; margin-top: 0.5rem; display: none; }

    #codex-tab { display: flex; gap: 1.5rem; margin-top: 1rem; }
    #codex-list-pane { flex: 0 0 320px; }
    #codex-detail-pane { flex: 1; min-width: 0; }
    #codex-filters { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    #codex-filters select, #codex-filters input { padding: 0.35rem; font-size: 0.9rem; }
    #codex-search { flex: 1; }
    #codex-entries { list-style: none; padding: 0; margin: 0; max-height: 70vh; overflow-y: auto; border: 1px solid #ccc; }
    #codex-entries li { padding: 0.5rem 0.75rem; border-bottom: 1px solid #eee; cursor: pointer; }
    #codex-entries li:hover { background: #f5f5f5; }
    #codex-entries li.active { background: #e0e8ff; }
    #codex-entries .entry-category { font-size: 0.75rem; color: #666; }
    #codex-detail { border: 1px solid #ccc; padding: 1rem; min-height: 200px; }
    #codex-detail h2 { margin-top: 0; }
    #codex-view-badge { display: inline-block; padding: 0.15rem 0.5rem; font-size: 0.75rem; border-radius: 3px; margin-left: 0.5rem; vertical-align: middle; }
    #codex-view-badge.gm { background: #ffe0b0; }
    #codex-view-badge.player { background: #c8e6c9; }
    #codex-tags span { display: inline-block; background: #eee; border-radius: 3px; padding: 0.1rem 0.4rem; font-size: 0.75rem; margin-right: 0.25rem; }
    #codex-empty { color: #888; }

    #codex-related { margin-top: 0.75rem; }
    #codex-related h4 { margin: 0 0 0.35rem 0; font-size: 0.8rem; color: #666; }
    #codex-related-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .related-chip {
      display: inline-block; background: #e0e8ff; border-radius: 3px;
      padding: 0.25rem 0.6rem; font-size: 0.85rem; cursor: pointer; border: none;
    }
    .related-chip:hover { background: #c8d4ff; }

    #entry-form-related-list { list-style: none; padding: 0; margin: 0.3rem 0 0 0; }
    #entry-form-related-list li {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.25rem 0.5rem; background: #f5f5f5; border-radius: 3px; margin-bottom: 0.25rem; font-size: 0.85rem;
    }
    #entry-form-related-list button { padding: 0.1rem 0.5rem; cursor: pointer; font-size: 0.8rem; }
    #entry-form-related-add { display: flex; gap: 0.4rem; margin-top: 0.3rem; }
    #entry-form-related-add select { flex: 1; margin-top: 0; }
    #entry-form-related-add button { padding: 0.35rem 0.7rem; cursor: pointer; }

    #codex-new-btn { display: none; margin-bottom: 0.75rem; padding: 0.4rem 0.8rem; cursor: pointer; }
    #codex-detail-actions { display: none; gap: 0.5rem; margin-top: 1rem; }
    #codex-detail-actions button { padding: 0.3rem 0.7rem; cursor: pointer; }

    #entry-form-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      align-items: center; justify-content: center; z-index: 1000;
    }
    #entry-form-overlay.open { display: flex; }
    #entry-form {
      background: #fff; border-radius: 4px; padding: 1.25rem 1.5rem;
      width: 90%; max-width: 520px; max-height: 85vh; overflow-y: auto;
    }
    #entry-form h3 { margin-top: 0; }
    #entry-form label { display: block; margin-top: 0.75rem; font-size: 0.85rem; font-weight: bold; }
    #entry-form input[type="text"], #entry-form textarea, #entry-form select {
      width: 100%; box-sizing: border-box; padding: 0.4rem; font-size: 0.9rem; margin-top: 0.2rem;
    }
    #entry-form textarea { min-height: 80px; resize: vertical; }
    #entry-form-actions { margin-top: 1.25rem; display: flex; gap: 0.5rem; justify-content: flex-end; }
    #entry-form-actions button { padding: 0.4rem 0.9rem; cursor: pointer; }
    #entry-form-error { color: #b00020; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
    #build-version { margin-top: 2rem; font-size: 0.7rem; color: #bbb; }
  </style>
</head>
<body>
  <header>
    <h1 id="campaign-title"></h1>
    <div id="auth-area">
      <span id="role-badge">Viewer</span>
      <span id="user-email"></span>
      <div id="signin-buttons">
        <button id="signin-google">Sign in with Google</button>
      </div>
      <button id="sign-out-btn" style="display:none;">Sign out</button>
    </div>
  </header>

  <nav id="tabs">
    <button id="tab-btn-codex" class="active" data-tab="codex-panel">Codex</button>
    <button id="tab-btn-map" data-tab="map-panel">Map</button>
  </nav>

  <div id="codex-panel" class="tab-panel active">
    <div id="codex-tab">
      <div id="codex-list-pane">
        <button id="codex-new-btn">+ New entry</button>
        <div id="codex-filters">
          <select id="codex-category-filter">
            <option value="">All categories</option>
          </select>
          <input id="codex-search" type="text" placeholder="Search name/tags...">
        </div>
        <ul id="codex-entries"></ul>
      </div>
      <div id="codex-detail-pane">
        <div id="codex-detail"><p id="codex-empty">Select an entry.</p></div>
      </div>
    </div>
  </div>
  <div id="map-panel" class="tab-panel">
    <p id="map-tab-placeholder">Loading map…</p>
    <button id="map-back-btn" style="display:none;">&larr; Back to parent map</button>
    <div id="map-gm-controls">
      <button id="map-add-pin-btn">+ Add pin</button>
      <button id="map-remove-pin-btn">Remove pin</button>
      <span id="map-mode-hint"></span>
    </div>
    <div id="map-container"></div>
  </div>

  <div id="entry-form-overlay">
    <div id="entry-form">
      <h3 id="entry-form-title">New Entry</h3>
      <label for="entry-form-name">Name</label>
      <input type="text" id="entry-form-name">

      <label for="entry-form-category">Category</label>
      <select id="entry-form-category"></select>

      <label for="entry-form-tags">Tags (comma-separated)</label>
      <input type="text" id="entry-form-tags">

      <label for="entry-form-content-gm">GM content</label>
      <textarea id="entry-form-content-gm"></textarea>

      <label for="entry-form-content-player">Player content</label>
      <textarea id="entry-form-content-player"></textarea>

      <label><input type="checkbox" id="entry-form-public"> Public (visible to signed-out viewers)</label>

      <label>Related entries</label>
      <ul id="entry-form-related-list"></ul>
      <div id="entry-form-related-add">
        <select id="entry-form-related-select"></select>
        <button id="entry-form-related-add-btn" type="button">Add</button>
      </div>

      <p id="entry-form-error"></p>

      <div id="entry-form-actions">
        <button id="entry-form-cancel" type="button">Cancel</button>
        <button id="entry-form-save" type="button">Save</button>
      </div>
    </div>
  </div>

  <div id="pin-form-overlay">
    <div id="pin-form">
      <h3>Add pin</h3>

      <div id="pin-form-type-toggle">
        <label><input type="radio" name="pin-form-type" value="entry" checked> Link to entry</label>
        <label><input type="radio" name="pin-form-type" value="childmap"> Link to child map</label>
      </div>

      <div id="pin-form-entry-fields">
        <label for="pin-form-entry">Codex entry</label>
        <select id="pin-form-entry"></select>
      </div>

      <div id="pin-form-childmap-fields" style="display:none;">
        <div id="pin-form-childmap-mode-toggle">
          <label><input type="radio" name="pin-form-childmap-mode" value="existing" checked> Existing map</label>
          <label><input type="radio" name="pin-form-childmap-mode" value="new"> New map</label>
        </div>

        <div id="pin-form-childmap-existing-fields">
          <label for="pin-form-childmap-select">Child map</label>
          <select id="pin-form-childmap-select"></select>
        </div>

        <div id="pin-form-childmap-new-fields" style="display:none;">
          <label for="pin-form-childmap-name">New map name</label>
          <input type="text" id="pin-form-childmap-name" placeholder="e.g. Baker (town)">
          <label for="pin-form-childmap-image">Image filename</label>
          <input type="text" id="pin-form-childmap-image" placeholder="maps/baker-town.webp">
          <label><input type="checkbox" id="pin-form-childmap-public"> Public (visible to signed-out viewers)</label>
          <p id="pin-form-childmap-image-hint">
            Drop the image file in <code>public/maps/</code> and push to
            <code>main</code> first &mdash; this field just registers the
            path, it doesn't upload the file.
          </p>
        </div>

        <label for="pin-form-radius">Circle radius (map units)</label>
        <input type="number" id="pin-form-radius" value="150" min="1">
      </div>

      <p id="pin-form-error"></p>

      <div id="pin-form-actions">
        <button id="pin-form-cancel" type="button">Cancel</button>
        <button id="pin-form-save" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider,
      signInWithPopup, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore, collection, onSnapshot, doc, getDoc, addDoc, updateDoc, deleteDoc, setDoc, writeBatch
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const CONFIG = window.APP_CONFIG;
    document.getElementById('campaign-title').textContent = CONFIG.campaignName;
    document.getElementById('tab-btn-codex').textContent = CONFIG.tabs.codex;
    document.getElementById('tab-btn-map').textContent = CONFIG.tabs.map;

    const firebaseApp = initializeApp(CONFIG.firebase);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);

    // --- Auth: signInWithPopup works here because this app is served from
    // Firebase Hosting on daggerheart-campaign-codex.web.app/.firebaseapp.com
    // — the same origin as authDomain. Under the old Apps Script hosting
    // (script.googleusercontent.com), this same call hit an unfixable origin
    // restriction — see auth-pivot-context.md for that postmortem, and the
    // separate Option A attempt (native Apps Script auth) that followed and
    // was abandoned when it turned out unable to force a sign-in prompt for
    // logged-out visitors. Google-only per Gregg's call — GitHub/Apple would
    // just be adding more providers below if that changes later.
    const roleBadge = document.getElementById('role-badge');
    const userEmailEl = document.getElementById('user-email');
    const signInButtonsEl = document.getElementById('signin-buttons');
    const signOutBtn = document.getElementById('sign-out-btn');

    function signInWith(providerFactory) {
      return function () {
        signInWithPopup(auth, providerFactory()).catch(function (err) {
          alert('Sign-in failed: ' + err.message);
        });
      };
    }

    document.getElementById('signin-google').addEventListener('click', signInWith(function () {
      return new GoogleAuthProvider();
    }));

    signOutBtn.addEventListener('click', function () {
      signOut(auth);
    });

    // --- Role resolution ---------------------------------------------------
    // GM: signed-in email matches CONFIG.gmEmail.
    // Player: signed-in email exists in players/{email} whitelist collection.
    // Viewer: everyone else, including unauthenticated.
    let currentRole = 'viewer';

    function resolveRole(user) {
      if (!user || !user.email) return Promise.resolve('viewer');
      if (user.email === CONFIG.gmEmail) return Promise.resolve('gm');
      return getDoc(doc(db, 'players', user.email)).then(function (snap) {
        return snap.exists() ? 'player' : 'viewer';
      });
    }

    onAuthStateChanged(auth, function (user) {
      if (user) {
        signInButtonsEl.style.display = 'none';
        signOutBtn.style.display = 'inline';
        userEmailEl.textContent = user.email || '(no email shared)';
      } else {
        signInButtonsEl.style.display = 'flex';
        signOutBtn.style.display = 'none';
        userEmailEl.textContent = '';
      }
      resolveRole(user).then(function (role) {
        currentRole = role;
        roleBadge.textContent = role;
        newEntryBtn.style.display = (role === 'gm') ? 'inline-block' : 'none';
        mapGmControlsEl.style.display = (role === 'gm') ? 'flex' : 'none';
        renderDetailForSelected();
        maybeBootstrapRootMap();
        maybeBackfillPublicFlag('entries', allEntries);
        maybeBackfillPublicFlag('maps', allMaps);
      });
    });

    // --- Codex tab: live entries read --------------------------------------
    const categoryFilterEl = document.getElementById('codex-category-filter');
    const searchEl = document.getElementById('codex-search');
    const listEl = document.getElementById('codex-entries');
    const detailEl = document.getElementById('codex-detail');

    const formCategoryEl = document.getElementById('entry-form-category');

    CONFIG.categories.forEach(function (cat) {
      const filterOpt = document.createElement('option');
      filterOpt.value = cat;
      filterOpt.textContent = cat;
      categoryFilterEl.appendChild(filterOpt);

      const formOpt = document.createElement('option');
      formOpt.value = cat;
      formOpt.textContent = cat;
      formCategoryEl.appendChild(formOpt);
    });

    let allEntries = [];
    let selectedId = null;
    let gmPreviewAsPlayer = false;

    onSnapshot(collection(db, 'entries'), function (snapshot) {
      allEntries = [];
      snapshot.forEach(function (docSnap) {
        const data = docSnap.data();
        if (data.type === 'codex') {
          allEntries.push(Object.assign({ id: docSnap.id }, data));
        }
      });
      renderList();
      renderDetailForSelected();
      maybeBackfillPublicFlag('entries', allEntries);
    }, function (err) {
      listEl.innerHTML = '<li>Error loading entries: ' + err.message + '</li>';
    });

    // Phase 7a one-time migration: pre-existing entries/maps predate the
    // `public` field. Gregg owns all current content, so backfill them to
    // public: true rather than have them silently go dark once the gated
    // Firestore rules deploy. GM-only, idempotent (only touches docs
    // actually missing the field), runs once per collection per page load.
    // IMPORTANT: deploy this code (with rules still open-read) first, let
    // it run once against production data, THEN deploy the gated rules —
    // otherwise gated rules go live before anything is flagged public and
    // non-GM/Player reads break in between.
    const backfillAttempted = { entries: false, maps: false };
    function maybeBackfillPublicFlag(collectionName, docs) {
      if (currentRole !== 'gm') return;
      if (backfillAttempted[collectionName]) return;
      const missing = docs.filter(function (d) { return d.public === undefined; });
      if (missing.length === 0) return;
      backfillAttempted[collectionName] = true;
      const batch = writeBatch(db);
      missing.forEach(function (d) {
        batch.update(doc(db, collectionName, d.id), { public: true });
      });
      batch.commit().catch(function (err) {
        backfillAttempted[collectionName] = false; // allow retry, e.g. transient network error
        console.error('Public-flag backfill failed for ' + collectionName + ':', err.message);
      });
    }

    function matchesFilters(entry) {
      const cat = categoryFilterEl.value;
      if (cat && entry.category !== cat) return false;

      const q = searchEl.value.trim().toLowerCase();
      if (!q) return true;
      const nameMatch = (entry.name || '').toLowerCase().indexOf(q) !== -1;
      const tagMatch = (entry.tags || []).some(function (t) {
        return t.toLowerCase().indexOf(q) !== -1;
      });
      return nameMatch || tagMatch;
    }

    function renderList() {
      const filtered = allEntries
        .filter(matchesFilters)
        .sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });

      listEl.innerHTML = '';
      if (filtered.length === 0) {
        const li = document.createElement('li');
        li.textContent = 'No entries match.';
        listEl.appendChild(li);
        return;
      }

      filtered.forEach(function (entry) {
        const li = document.createElement('li');
        li.dataset.id = entry.id;
        if (entry.id === selectedId) li.classList.add('active');

        const nameDiv = document.createElement('div');
        nameDiv.textContent = entry.name;
        const catDiv = document.createElement('div');
        catDiv.className = 'entry-category';
        catDiv.textContent = entry.category || '';

        li.appendChild(nameDiv);
        li.appendChild(catDiv);
        li.addEventListener('click', function () {
          selectedId = entry.id;
          renderList();
          renderDetailForSelected();
        });
        listEl.appendChild(li);
      });
    }

    function renderDetailForSelected() {
      const entry = allEntries.find(function (e) { return e.id === selectedId; });
      if (!entry) {
        detailEl.innerHTML = '<p id="codex-empty">Select an entry.</p>';
        return;
      }

      const effectiveRole = (currentRole === 'gm' && gmPreviewAsPlayer) ? 'player' : currentRole;
      const showGmContent = effectiveRole === 'gm';
      const bodyText = showGmContent ? entry.content_gm : entry.content_player;

      detailEl.innerHTML = '';

      const heading = document.createElement('h2');
      heading.textContent = entry.name;

      const badge = document.createElement('span');
      badge.id = 'codex-view-badge';
      badge.className = showGmContent ? 'gm' : 'player';
      badge.textContent = showGmContent ? 'GM view' : 'Player view';
      heading.appendChild(badge);
      detailEl.appendChild(heading);

      if (currentRole === 'gm') {
        const toggleBtn = document.createElement('button');
        toggleBtn.textContent = gmPreviewAsPlayer ? 'Show GM content' : 'Preview player view';
        toggleBtn.addEventListener('click', function () {
          gmPreviewAsPlayer = !gmPreviewAsPlayer;
          renderDetailForSelected();
        });
        detailEl.appendChild(toggleBtn);
      }

      const catP = document.createElement('p');
      catP.innerHTML = '<em>' + (entry.category || '') + '</em>';
      detailEl.appendChild(catP);

      const bodyP = document.createElement('p');
      bodyP.textContent = bodyText || '(no content for this view)';
      detailEl.appendChild(bodyP);

      if (entry.tags && entry.tags.length) {
        const tagsDiv = document.createElement('div');
        tagsDiv.id = 'codex-tags';
        entry.tags.forEach(function (t) {
          const span = document.createElement('span');
          span.textContent = t;
          tagsDiv.appendChild(span);
        });
        detailEl.appendChild(tagsDiv);
      }

      // Related entries: only show links to targets visible in the current
      // effective view (GM sees all; player/viewer only sees targets that
      // themselves have player-visible content). Dangling IDs (deleted
      // target entry) are silently skipped.
      const relatedIds = entry.relatedIds || [];
      if (relatedIds.length) {
        const visibleRelated = relatedIds
          .map(function (id) { return allEntries.find(function (e) { return e.id === id; }); })
          .filter(function (target) {
            if (!target) return false;
            if (showGmContent) return true;
            return !!(target.content_player && target.content_player.trim());
          });

        if (visibleRelated.length) {
          const relatedDiv = document.createElement('div');
          relatedDiv.id = 'codex-related';
          const heading = document.createElement('h4');
          heading.textContent = 'Related';
          relatedDiv.appendChild(heading);

          const chipsDiv = document.createElement('div');
          chipsDiv.id = 'codex-related-chips';
          visibleRelated.forEach(function (target) {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'related-chip';
            chip.textContent = target.name;
            chip.addEventListener('click', function () {
              selectedId = target.id;
              renderList();
              renderDetailForSelected();
            });
            chipsDiv.appendChild(chip);
          });
          relatedDiv.appendChild(chipsDiv);
          detailEl.appendChild(relatedDiv);
        }
      }

      if (currentRole === 'gm') {
        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edit entry';
        editBtn.style.marginTop = '1rem';
        editBtn.addEventListener('click', function () {
          openEntryForm(entry);
        });
        detailEl.appendChild(editBtn);

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete entry';
        deleteBtn.style.marginTop = '1rem';
        deleteBtn.style.marginLeft = '0.5rem';
        deleteBtn.addEventListener('click', function () {
          deleteEntry(entry);
        });
        detailEl.appendChild(deleteBtn);
      }
    }

    categoryFilterEl.addEventListener('change', renderList);
    searchEl.addEventListener('input', renderList);

    // --- Entry authoring (GM only): create ---------------------------------
    const newEntryBtn = document.getElementById('codex-new-btn');
    const formOverlayEl = document.getElementById('entry-form-overlay');
    const formTitleEl = document.getElementById('entry-form-title');
    const formNameEl = document.getElementById('entry-form-name');
    const formTagsEl = document.getElementById('entry-form-tags');
    const formContentGmEl = document.getElementById('entry-form-content-gm');
    const formContentPlayerEl = document.getElementById('entry-form-content-player');
    const formPublicEl = document.getElementById('entry-form-public');
    const formRelatedListEl = document.getElementById('entry-form-related-list');
    const formRelatedSelectEl = document.getElementById('entry-form-related-select');
    const formRelatedAddBtn = document.getElementById('entry-form-related-add-btn');
    const formErrorEl = document.getElementById('entry-form-error');
    const formSaveBtn = document.getElementById('entry-form-save');
    const formCancelBtn = document.getElementById('entry-form-cancel');

    let editingEntryId = null;
    let formRelatedIds = [];

    function renderRelatedFormList() {
      formRelatedListEl.innerHTML = '';
      formRelatedIds.forEach(function (id) {
        const target = allEntries.find(function (e) { return e.id === id; });
        const li = document.createElement('li');
        const nameSpan = document.createElement('span');
        nameSpan.textContent = target ? target.name : '(deleted entry)';
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.textContent = 'Remove';
        removeBtn.addEventListener('click', function () {
          formRelatedIds = formRelatedIds.filter(function (rid) { return rid !== id; });
          renderRelatedFormList();
          populateRelatedSelect();
        });
        li.appendChild(nameSpan);
        li.appendChild(removeBtn);
        formRelatedListEl.appendChild(li);
      });
    }

    function populateRelatedSelect() {
      formRelatedSelectEl.innerHTML = '';
      const available = allEntries
        .filter(function (e) { return e.id !== editingEntryId && formRelatedIds.indexOf(e.id) === -1; })
        .sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
      if (available.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = '(no more entries to link)';
        opt.disabled = true;
        formRelatedSelectEl.appendChild(opt);
        return;
      }
      available.forEach(function (e) {
        const opt = document.createElement('option');
        opt.value = e.id;
        opt.textContent = e.name;
        formRelatedSelectEl.appendChild(opt);
      });
    }

    formRelatedAddBtn.addEventListener('click', function () {
      const id = formRelatedSelectEl.value;
      if (!id || formRelatedIds.indexOf(id) !== -1) return;
      formRelatedIds.push(id);
      renderRelatedFormList();
      populateRelatedSelect();
    });

    function openEntryForm(entry) {
      editingEntryId = entry ? entry.id : null;
      formTitleEl.textContent = entry ? 'Edit Entry' : 'New Entry';
      formNameEl.value = entry ? entry.name || '' : '';
      formCategoryEl.value = entry ? (entry.category || CONFIG.categories[0]) : CONFIG.categories[0];
      formTagsEl.value = entry && entry.tags ? entry.tags.join(', ') : '';
      formContentGmEl.value = entry ? entry.content_gm || '' : '';
      formContentPlayerEl.value = entry ? entry.content_player || '' : '';
      formPublicEl.checked = entry ? !!entry.public : false; // false-safe default for new entries
      formRelatedIds = entry && entry.relatedIds ? entry.relatedIds.slice() : [];
      renderRelatedFormList();
      populateRelatedSelect();
      formErrorEl.style.display = 'none';
      formErrorEl.textContent = '';
      formOverlayEl.classList.add('open');
      formNameEl.focus();
    }

    function closeEntryForm() {
      formOverlayEl.classList.remove('open');
    }

    function showFormError(message) {
      formErrorEl.textContent = message;
      formErrorEl.style.display = 'block';
    }

    function saveEntry() {
      const name = formNameEl.value.trim();
      if (!name) {
        showFormError('Name is required.');
        return;
      }

      const tags = formTagsEl.value
        .split(',')
        .map(function (t) { return t.trim(); })
        .filter(function (t) { return t.length > 0; });

      const entryData = {
        type: 'codex',
        name: name,
        category: formCategoryEl.value,
        tags: tags,
        content_gm: formContentGmEl.value,
        content_player: formContentPlayerEl.value,
        public: formPublicEl.checked,
        relatedIds: formRelatedIds.slice()
      };

      formSaveBtn.disabled = true;
      const savePromise = editingEntryId
        ? updateDoc(doc(db, 'entries', editingEntryId), entryData)
        : addDoc(collection(db, 'entries'), entryData);

      savePromise.then(function () {
        formSaveBtn.disabled = false;
        closeEntryForm();
      }).catch(function (err) {
        formSaveBtn.disabled = false;
        showFormError('Save failed: ' + err.message);
      });
    }

    function deleteEntry(entry) {
      const confirmed = window.confirm('Delete "' + entry.name + '"? This cannot be undone.');
      if (!confirmed) return;

      deleteDoc(doc(db, 'entries', entry.id)).then(function () {
        if (selectedId === entry.id) {
          selectedId = null;
          renderDetailForSelected();
        }
      }).catch(function (err) {
        window.alert('Delete failed: ' + err.message);
      });
    }

    newEntryBtn.addEventListener('click', function () { openEntryForm(); });
    formCancelBtn.addEventListener('click', closeEntryForm);
    formSaveBtn.addEventListener('click', saveEntry);
    formOverlayEl.addEventListener('click', function (e) {
      if (e.target === formOverlayEl) closeEntryForm();
    });

    // --- Map tab -------------------------------------------------------
    document.querySelectorAll('nav#tabs button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('nav#tabs button').forEach(function (b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');

        if (btn.dataset.tab === 'map-panel') {
          ensureMapTabReady();
        }
      });
    });

    let leafletMap = null;
    let loadedMapId = null;
    let mapImgHeight = 0;
    let pinLayer = null;
    let allPins = [];
    let allMaps = [];
    let currentMapId = null;
    let mapBootstrapAttempted = false;
    let mapMode = null; // null | 'add' | 'remove'
    let pendingPinCoords = null;
    let mapNavStack = []; // stack of parent mapIds, for the "back to parent map" control

    const mapGmControlsEl = document.getElementById('map-gm-controls');
    const addPinBtn = document.getElementById('map-add-pin-btn');
    const removePinBtn = document.getElementById('map-remove-pin-btn');
    const modeHintEl = document.getElementById('map-mode-hint');
    const mapBackBtn = document.getElementById('map-back-btn');

    function updateBackButtonVisibility() {
      mapBackBtn.style.display = mapNavStack.length ? 'block' : 'none';
    }

    function navigateToChildMap(mapId) {
      mapNavStack.push(currentMapId);
      currentMapId = mapId;
      updateBackButtonVisibility();
      loadMap(currentMapId);
    }

    mapBackBtn.addEventListener('click', function () {
      if (!mapNavStack.length) return;
      currentMapId = mapNavStack.pop();
      updateBackButtonVisibility();
      loadMap(currentMapId);
    });

    const pinFormOverlayEl = document.getElementById('pin-form-overlay');
    const pinFormEntryEl = document.getElementById('pin-form-entry');
    const pinFormEntryFieldsEl = document.getElementById('pin-form-entry-fields');
    const pinFormChildMapFieldsEl = document.getElementById('pin-form-childmap-fields');
    const pinFormChildMapExistingFieldsEl = document.getElementById('pin-form-childmap-existing-fields');
    const pinFormChildMapNewFieldsEl = document.getElementById('pin-form-childmap-new-fields');
    const pinFormChildMapSelectEl = document.getElementById('pin-form-childmap-select');
    const pinFormChildMapNameEl = document.getElementById('pin-form-childmap-name');
    const pinFormChildMapImageEl = document.getElementById('pin-form-childmap-image');
    const pinFormChildMapPublicEl = document.getElementById('pin-form-childmap-public');
    const pinFormRadiusEl = document.getElementById('pin-form-radius');
    const pinFormErrorEl = document.getElementById('pin-form-error');
    const pinFormSaveBtn = document.getElementById('pin-form-save');
    const pinFormCancelBtn = document.getElementById('pin-form-cancel');

    function getPinFormType() {
      const checked = document.querySelector('input[name="pin-form-type"]:checked');
      return checked ? checked.value : 'entry';
    }

    function getChildMapMode() {
      const checked = document.querySelector('input[name="pin-form-childmap-mode"]:checked');
      return checked ? checked.value : 'existing';
    }

    function updatePinFormTypeVisibility() {
      const type = getPinFormType();
      pinFormEntryFieldsEl.style.display = (type === 'entry') ? 'block' : 'none';
      pinFormChildMapFieldsEl.style.display = (type === 'childmap') ? 'block' : 'none';
    }

    function updateChildMapModeVisibility() {
      const mode = getChildMapMode();
      pinFormChildMapExistingFieldsEl.style.display = (mode === 'existing') ? 'block' : 'none';
      pinFormChildMapNewFieldsEl.style.display = (mode === 'new') ? 'block' : 'none';
    }

    Array.prototype.forEach.call(document.querySelectorAll('input[name="pin-form-type"]'), function (radio) {
      radio.addEventListener('change', updatePinFormTypeVisibility);
    });
    Array.prototype.forEach.call(document.querySelectorAll('input[name="pin-form-childmap-mode"]'), function (radio) {
      radio.addEventListener('change', updateChildMapModeVisibility);
    });

    function setMapMode(mode) {
      mapMode = (mapMode === mode) ? null : mode;
      addPinBtn.classList.toggle('active-mode', mapMode === 'add');
      removePinBtn.classList.toggle('active-mode', mapMode === 'remove');
      if (mapMode === 'add') {
        modeHintEl.textContent = 'Click the map to place a pin.';
      } else if (mapMode === 'remove') {
        modeHintEl.textContent = 'Click a pin to remove it.';
      } else {
        modeHintEl.textContent = '';
      }
    }

    addPinBtn.addEventListener('click', function () { setMapMode('add'); });
    removePinBtn.addEventListener('click', function () { setMapMode('remove'); });

    function openPinForm(coords) {
      pendingPinCoords = coords;

      document.querySelector('input[name="pin-form-type"][value="entry"]').checked = true;
      document.querySelector('input[name="pin-form-childmap-mode"][value="existing"]').checked = true;
      updatePinFormTypeVisibility();
      updateChildMapModeVisibility();

      pinFormEntryEl.innerHTML = '';
      allEntries
        .slice()
        .sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); })
        .forEach(function (entry) {
          const opt = document.createElement('option');
          opt.value = entry.id;
          opt.textContent = entry.name;
          pinFormEntryEl.appendChild(opt);
        });

      // Candidate child maps: any map that isn't the current map itself.
      // Not excluding deeper cycles (e.g. linking to an ancestor) here —
      // simple guard, not exhaustive; GM is trusted not to build a loop.
      pinFormChildMapSelectEl.innerHTML = '';
      const candidates = allMaps
        .filter(function (m) { return m.id !== currentMapId; })
        .sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
      if (candidates.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = '(no other maps yet — create one below)';
        opt.disabled = true;
        pinFormChildMapSelectEl.appendChild(opt);
        document.querySelector('input[name="pin-form-childmap-mode"][value="new"]').checked = true;
        updateChildMapModeVisibility();
      } else {
        candidates.forEach(function (m) {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name;
          pinFormChildMapSelectEl.appendChild(opt);
        });
      }

      pinFormChildMapNameEl.value = '';
      pinFormChildMapImageEl.value = '';
      pinFormChildMapPublicEl.checked = false;
      pinFormRadiusEl.value = '150';

      pinFormErrorEl.style.display = 'none';
      pinFormErrorEl.textContent = '';
      pinFormOverlayEl.classList.add('open');
    }

    function closePinForm() {
      pinFormOverlayEl.classList.remove('open');
      pendingPinCoords = null;
    }

    pinFormCancelBtn.addEventListener('click', closePinForm);
    pinFormOverlayEl.addEventListener('click', function (e) {
      if (e.target === pinFormOverlayEl) closePinForm();
    });

    pinFormSaveBtn.addEventListener('click', function () {
      if (!pendingPinCoords) {
        closePinForm();
        return;
      }

      const type = getPinFormType();

      if (type === 'entry') {
        const entryId = pinFormEntryEl.value;
        if (!entryId) {
          pinFormErrorEl.textContent = 'No entries available to link.';
          pinFormErrorEl.style.display = 'block';
          return;
        }
        savePin({
          entryId: entryId,
          x: pendingPinCoords.x,
          y: pendingPinCoords.y,
          mapId: currentMapId
        });
        return;
      }

      // type === 'childmap'
      const radius = Number(pinFormRadiusEl.value);
      if (!radius || radius <= 0) {
        pinFormErrorEl.textContent = 'Radius must be a positive number.';
        pinFormErrorEl.style.display = 'block';
        return;
      }

      const mode = getChildMapMode();
      if (mode === 'existing') {
        const childMapId = pinFormChildMapSelectEl.value;
        if (!childMapId) {
          pinFormErrorEl.textContent = 'No child map selected.';
          pinFormErrorEl.style.display = 'block';
          return;
        }
        savePin({
          childMapId: childMapId,
          radius: radius,
          x: pendingPinCoords.x,
          y: pendingPinCoords.y,
          mapId: currentMapId
        });
        return;
      }

      // mode === 'new': create the map doc first, then the pin referencing it
      const name = pinFormChildMapNameEl.value.trim();
      const image = pinFormChildMapImageEl.value.trim();
      if (!name || !image) {
        pinFormErrorEl.textContent = 'New map needs both a name and an image filename.';
        pinFormErrorEl.style.display = 'block';
        return;
      }

      pinFormSaveBtn.disabled = true;
      addDoc(collection(db, 'maps'), {
        name: name,
        image: image,
        parentMapId: currentMapId,
        public: pinFormChildMapPublicEl.checked
      }).then(function (mapDocRef) {
        return savePin({
          childMapId: mapDocRef.id,
          radius: radius,
          x: pendingPinCoords.x,
          y: pendingPinCoords.y,
          mapId: currentMapId
        });
      }).catch(function (err) {
        pinFormSaveBtn.disabled = false;
        pinFormErrorEl.textContent = 'Create map failed: ' + err.message;
        pinFormErrorEl.style.display = 'block';
      });
    });

    function savePin(pinData) {
      pinFormSaveBtn.disabled = true;
      return addDoc(collection(db, 'pins'), pinData).then(function () {
        pinFormSaveBtn.disabled = false;
        closePinForm();
        setMapMode('add'); // toggles back off, matching the button that opened it
      }).catch(function (err) {
        pinFormSaveBtn.disabled = false;
        pinFormErrorEl.textContent = 'Save failed: ' + err.message;
        pinFormErrorEl.style.display = 'block';
      });
    }

    function removePin(pin) {
      let label;
      if (pin.childMapId) {
        const targetMap = allMaps.find(function (m) { return m.id === pin.childMapId; });
        label = targetMap ? ('map link: ' + targetMap.name) : '(unlinked map pin)';
      } else {
        const entry = allEntries.find(function (e) { return e.id === pin.entryId; });
        label = entry ? entry.name : '(unlinked pin)';
      }
      const confirmed = window.confirm('Remove pin for "' + label + '"?');
      if (!confirmed) return;

      deleteDoc(doc(db, 'pins', pin.id)).catch(function (err) {
        window.alert('Remove pin failed: ' + err.message);
      });
    }

    function switchToCodexEntry(entryId) {
      selectedId = entryId;
      renderList();
      renderDetailForSelected();

      document.querySelectorAll('nav#tabs button').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
      document.getElementById('tab-btn-codex').classList.add('active');
      document.getElementById('codex-panel').classList.add('active');
    }

    function renderPins() {
      if (!leafletMap) return;
      if (!pinLayer) {
        pinLayer = L.layerGroup().addTo(leafletMap);
      }
      pinLayer.clearLayers();

      const rootId = getRootMapId();
      const pinsForCurrentMap = allPins.filter(function (pin) {
        return pin.mapId ? pin.mapId === currentMapId : currentMapId === rootId;
      });

      pinsForCurrentMap.forEach(function (pin) {
        const lat = mapImgHeight - pin.y;

        if (pin.childMapId) {
          // Circle pin: links to a child map. Radius is in map units (this
          // map's own pixel coordinate space), scaling visually with zoom —
          // meant to be sized to roughly match the region it zooms into.
          const targetMap = allMaps.find(function (m) { return m.id === pin.childMapId; });
          const circle = L.circle([lat, pin.x], {
            radius: pin.radius || 60,
            color: '#8a4fd6',
            weight: 2,
            fillColor: '#8a4fd6',
            fillOpacity: 0.2
          });
          circle.bindTooltip(targetMap ? ('\u2192 ' + targetMap.name) : '(unlinked map pin)');
          circle.on('click', function () {
            if (mapMode === 'remove' && currentRole === 'gm') {
              removePin(pin);
              return;
            }
            if (targetMap) {
              navigateToChildMap(targetMap.id);
            }
          });
          circle.addTo(pinLayer);
          return;
        }

        const entry = allEntries.find(function (e) { return e.id === pin.entryId; });
        const marker = L.marker([lat, pin.x]);
        marker.bindTooltip(entry ? entry.name : '(unlinked pin)');
        marker.on('click', function () {
          if (mapMode === 'remove' && currentRole === 'gm') {
            removePin(pin);
            return;
          }
          if (entry) {
            switchToCodexEntry(entry.id);
          }
        });
        marker.addTo(pinLayer);
      });
    }

    onSnapshot(collection(db, 'pins'), function (snapshot) {
      allPins = [];
      snapshot.forEach(function (docSnap) {
        allPins.push(Object.assign({ id: docSnap.id }, docSnap.data()));
      });
      renderPins();
    });

    // --- Maps (Phase 6): dynamic map registry replacing the old
    // config.js-hardcoded single map. Root map has parentMapId === null.
    function getRootMapId() {
      const root = allMaps.find(function (m) { return !m.parentMapId; });
      return root ? root.id : null;
    }

    // One-time migration bootstrap: if no maps exist yet and the current
    // user is GM, seed a root map doc from the legacy CONFIG.mapImage
    // value. Uses a fixed doc ID ('root') rather than addDoc's random ID
    // so this is idempotent even if multiple page loads/tabs race to
    // bootstrap simultaneously — they all write the same doc, last write
    // wins, no duplicates. Runs at most once per page load (guarded by
    // mapBootstrapAttempted); safe to leave in place long-term as a no-op
    // once any maps doc exists.
    function maybeBootstrapRootMap() {
      if (mapBootstrapAttempted) return;
      if (allMaps.length > 0) return;
      if (currentRole !== 'gm') return;
      if (!CONFIG.mapImage) return;
      mapBootstrapAttempted = true;
      setDoc(doc(db, 'maps', 'root'), {
        name: CONFIG.campaignName || 'Root map',
        image: CONFIG.mapImage,
        parentMapId: null,
        public: true // pre-existing content, no copyright concern (Phase 7a)
      }).catch(function (err) {
        mapBootstrapAttempted = false; // allow retry, e.g. transient network error
        console.error('Root map bootstrap failed:', err.message);
      });
    }

    onSnapshot(collection(db, 'maps'), function (snapshot) {
      allMaps = [];
      snapshot.forEach(function (docSnap) {
        allMaps.push(Object.assign({ id: docSnap.id }, docSnap.data()));
      });
      maybeBootstrapRootMap();
      maybeBackfillPublicFlag('maps', allMaps);
      if (!currentMapId || !allMaps.find(function (m) { return m.id === currentMapId; })) {
        currentMapId = getRootMapId();
      }
      if (document.getElementById('map-panel').classList.contains('active')) {
        ensureMapTabReady();
      }
    });

    function ensureMapTabReady() {
      if (!currentMapId) return; // maps not loaded/bootstrapped yet
      if (leafletMap && loadedMapId === currentMapId) {
        renderPins();
        return;
      }
      loadMap(currentMapId);
    }

    function loadMap(mapId) {
      const mapDoc = allMaps.find(function (m) { return m.id === mapId; });
      const placeholderEl = document.getElementById('map-tab-placeholder');
      const containerEl = document.getElementById('map-container');

      if (leafletMap) {
        leafletMap.remove();
        leafletMap = null;
        pinLayer = null;
      }

      if (!mapDoc) {
        placeholderEl.style.display = 'block';
        containerEl.style.display = 'none';
        placeholderEl.textContent = 'No map configured yet.';
        return;
      }

      try {
        if (typeof L === 'undefined') {
          placeholderEl.style.display = 'block';
          containerEl.style.display = 'none';
          placeholderEl.textContent = 'Map library (Leaflet) failed to load.';
          return;
        }

        const img = new Image();
        img.onload = function () {
          try {
            placeholderEl.style.display = 'none';
            containerEl.style.display = 'block';

            // Size the container to exactly match the image's aspect ratio
            // (constrained by whichever of width/max-height binds first),
            // so fitBounds has no mismatched axis to leave a margin on.
            const aspect = img.naturalHeight / img.naturalWidth;
            const availableWidth = containerEl.clientWidth;
            const maxHeight = window.innerHeight * 0.8;

            let targetWidth = availableWidth;
            let targetHeight = targetWidth * aspect;
            if (targetHeight > maxHeight) {
              targetHeight = maxHeight;
              targetWidth = targetHeight / aspect;
            }
            containerEl.style.width = targetWidth + 'px';
            containerEl.style.height = targetHeight + 'px';
            containerEl.style.margin = '1rem auto 0';

            mapImgHeight = img.naturalHeight;
            const bounds = [[0, 0], [img.naturalHeight, img.naturalWidth]];
            const map = L.map('map-container', {
              crs: L.CRS.Simple,
              minZoom: -3,
              zoomSnap: 0,
              zoomDelta: 0.5,
              maxBoundsViscosity: 1.0
            });
            L.imageOverlay(mapDoc.image, bounds).addTo(map);
            leafletMap = map;
            loadedMapId = mapId;

            map.on('click', function (e) {
              if (mapMode !== 'add' || currentRole !== 'gm') return;
              const x = e.latlng.lng;
              const y = mapImgHeight - e.latlng.lat;
              openPinForm({ x: x, y: y });
            });

            setTimeout(function () {
              map.invalidateSize();
              map.fitBounds(bounds);
              map.setMinZoom(map.getZoom());
              map.setMaxBounds(bounds);

              renderPins();
            }, 0);
          } catch (err) {
            placeholderEl.style.display = 'block';
            containerEl.style.display = 'none';
            placeholderEl.textContent = 'Map render error: ' + err.message;
          }
        };
        img.onerror = function () {
          placeholderEl.style.display = 'block';
          placeholderEl.textContent = 'Map image failed to load (' + mapDoc.image + ').';
        };
        img.src = mapDoc.image;
      } catch (err) {
        placeholderEl.style.display = 'block';
        placeholderEl.textContent = 'Map init error: ' + err.message;
      }
    }
  </script>

  <footer id="build-version">build __COMMIT_HASH__</footer>
