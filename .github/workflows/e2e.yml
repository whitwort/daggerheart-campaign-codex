name: E2E (player role)

# Deliberately separate from deploy.yml, not a new job in it (design
# discussion, Sep 2026): keeps deploy.yml's pipeline decoupled from
# Playwright's runtime/flake profile (browser install, emulator
# startup) rather than letting a flaky e2e run block an unrelated
# dev-hosting push. Still effectively blocking in practice if this is
# added as a required status check under branch protection.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.28.1

      - name: Install devDependencies
        run: npm install

      - name: Run player-role e2e smoke suite
        run: npm run test:e2e
