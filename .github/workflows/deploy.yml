name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  deploy-hosting-dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.28.1

      - name: Lint (no-undef gate)
        run: npx --yes eslint@8 --no-eslintrc -c .eslintrc.check.json public/js/*.js

      - name: Install rules test deps
        run: npm install

      - name: Firestore Security Rules unit tests
        run: npm run test:rules

      - name: Stamp build label
        run: sed -i "s/__BUILD_LABEL__/build $(git rev-parse --short HEAD) (dev)/" public/index.html

      - name: Stamp build hash
        run: sed -i "s/__BUILD_HASH__/$(git rev-parse --short HEAD)/" public/index.html

      - name: Point build at the dev Firebase project
        run: cp public/firebase-env.dev.js public/firebase-env.js

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_DEV }}' > /tmp/firebase-key.json

      - name: Deploy to Firebase Hosting (dev)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: firebase deploy --only hosting,firestore:rules,firestore:indexes --project daggerheart-campaign-codex-dev --non-interactive

      - name: Record deployed version in Firestore (dev)
        run: |
          gcloud auth activate-service-account --key-file=/tmp/firebase-key.json
          TOKEN=$(gcloud auth print-access-token)
          HASH=$(git rev-parse --short HEAD)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sS --fail-with-body -X PATCH \
            "https://firestore.googleapis.com/v1/projects/daggerheart-campaign-codex-dev/databases/(default)/documents/_meta/version" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
            -d "{\"fields\":{\"hash\":{\"stringValue\":\"${HASH}\"},\"deployedAt\":{\"timestampValue\":\"${NOW}\"}}}"

      - name: Publish deploy version doc
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: |
          npm install --no-save firebase-admin@12
          HASH=$(git rev-parse --short HEAD) node -e "
            const admin = require('firebase-admin');
            admin.initializeApp({ projectId: 'daggerheart-campaign-codex-dev' });
            admin.firestore().doc('_meta/version').set({
              hash: process.env.HASH,
              deployedAt: admin.firestore.FieldValue.serverTimestamp()
            }).then(() => { console.log('version doc written:', process.env.HASH); process.exit(0); })
             .catch(err => { console.error(err); process.exit(1); });
          "

  deploy-hosting-prod:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.28.1

      - name: Lint (no-undef gate)
        run: npx --yes eslint@8 --no-eslintrc -c .eslintrc.check.json public/js/*.js

      - name: Install rules test deps
        run: npm install

      - name: Firestore Security Rules unit tests
        run: npm run test:rules

      - name: Stamp build label
        run: |
          # The Release tag is the single source of version truth:
          # version = tag minus its leading "v" (v0.2b -> 0.2b). The old
          # VERSION file + drift check are gone -- publishing a release
          # IS the versioning act, nothing to keep in sync.
          HASH=$(git rev-parse --short HEAD)
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          LABEL="version ${VERSION} (${HASH} prod)"
          sed -i "s#__BUILD_LABEL__#${LABEL}#" public/index.html
          sed -i "s/__BUILD_HASH__/${HASH}/" public/index.html

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > /tmp/firebase-key.json

      - name: Deploy to Firebase Hosting (prod)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: firebase deploy --only hosting,firestore:rules,firestore:indexes --project daggerheart-campaign-codex --non-interactive

      - name: Record deployed version in Firestore (prod)
        run: |
          gcloud auth activate-service-account --key-file=/tmp/firebase-key.json
          TOKEN=$(gcloud auth print-access-token)
          HASH=$(git rev-parse --short HEAD)
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sS --fail-with-body -X PATCH \
            "https://firestore.googleapis.com/v1/projects/daggerheart-campaign-codex/databases/(default)/documents/_meta/version" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
            -d "{\"fields\":{\"hash\":{\"stringValue\":\"${HASH}\"},\"version\":{\"stringValue\":\"${VERSION}\"},\"deployedAt\":{\"timestampValue\":\"${NOW}\"}}}"

      - name: Publish deploy version doc
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: |
          npm install --no-save firebase-admin@12
          TAG="${{ github.event.release.tag_name }}"
          HASH=$(git rev-parse --short HEAD) VERSION="${TAG#v}" node -e "
            const admin = require('firebase-admin');
            admin.initializeApp({ projectId: 'daggerheart-campaign-codex' });
            admin.firestore().doc('_meta/version').set({
              hash: process.env.HASH,
              version: process.env.VERSION,
              deployedAt: admin.firestore.FieldValue.serverTimestamp()
            }).then(() => { console.log('version doc written:', process.env.HASH, process.env.VERSION); process.exit(0); })
             .catch(err => { console.error(err); process.exit(1); });
          "
