name: Deploy

on:
  push:
    branches: [main]

jobs:
  push-to-apps-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        run: echo '${{ secrets.CLASP_CREDENTIALS }}' | base64 -d > ~/.clasprc.json

      - name: Stamp build commit hash
        run: sed -i "s/__COMMIT_HASH__/$(git rev-parse --short HEAD)/" code.gs

      - name: Push to Apps Script
        run: clasp push --force

      - name: Deploy new version
        run: clasp deploy --description "Auto-deploy $(git rev-parse --short HEAD)"

  deploy-hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Stamp build commit hash
        run: sed -i "s/__COMMIT_HASH__/$(git rev-parse --short HEAD)/" public/index.html

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > /tmp/firebase-key.json

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
        run: firebase deploy --only hosting --project daggerheart-campaign-codex --non-interactive
